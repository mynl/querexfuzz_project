[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "querexfuzz"
version = "2.0.5"
description = "A flexible query engine for pandas DataFrames with SQL, regex, date, and fuzzy matching."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stephen J. Mildenhall", email = "steve@mynl.com" }]
dependencies = [
    "pandas>=2.0",
    "lark>=1.0",
    "pydantic>=2.0",
    "pyyaml",
    "python-dateutil",
    "tzlocal",
    "skimmatch",
]

# Read the Docs installs `.[docs]` (see .readthedocs.yaml), so this stays an extra.
[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-parser",
]

[project.urls]
Homepage = "https://github.com/mynl/querexfuzz_project"
Repository = "https://github.com/mynl/querexfuzz_project"
"Bug Tracker" = "https://github.com/mynl/querexfuzz_project/issues"
Documentation = "https://querexfuzz-project.readthedocs.io/en/latest/"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"querexfuzz" = ["*.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
