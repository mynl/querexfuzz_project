[project]
name = "querexfuzz"
version = "2.0.2"
description = "A flexible query engine for pandas DataFrames with SQL, regex, date, and fuzzy matching."
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "lark>=1.0",
    "pydantic>=2.0",
    "pyyaml",
    "python-dateutil",
    "tzlocal",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"querexfuzz" = ["*.lark"]
